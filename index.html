<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas - Kanban Minimalista</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="app-header">
        <div class="header-brand">
            <h1>Gerenciador de Tarefas</h1>
            <button id="btn-theme-toggle" class="btn-theme-toggle" type="button" aria-label="Alternar modo escuro ou claro">
                <span id="theme-icon">🌙</span> <span id="theme-text">Escuro</span>
            </button>
        </div>

        <div class="dashboard" id="dashboard">
            <div class="stat"><span>Total:</span> <strong id="stat-total">0</strong></div>
            <div class="stat"><span>Pendentes:</span> <strong id="stat-pending">0</strong></div>
            <div class="stat"><span>Concluídas:</span> <strong id="stat-done">0</strong></div>
            <div class="stat stat-progress">
                <span>Progresso:</span> <strong id="stat-progress">0%</strong>
                <div class="progress-bar-container" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
                    <div id="progress-bar-fill" class="progress-bar-fill"></div>
                </div>
            </div>
        </div>
    </header>

    <section class="task-creation">
        <form id="task-form" class="task-form">
            <div class="form-group">
                <label for="task-desc">Descrição</label>
                <input type="text" id="task-desc" placeholder="O que precisa ser feito?" required>
            </div>
            
            <div class="form-group">
                <label for="task-category">Categoria</label>
                <input type="text" id="task-category" placeholder="Ex: Estudos" required>
            </div>

            <div class="form-group">
                <label for="task-difficulty">Dificuldade</label>
                <select id="task-difficulty" required>
                    <option value="" disabled selected>Selecione</option>
                    <option value="facil">Fácil</option>
                    <option value="moderado">Moderado</option>
                    <option value="dificil">Difícil</option>
                </select>
            </div>

            <div class="form-group">
                <label for="task-date">Prazo</label>
                <input type="date" id="task-date" required>
            </div>

            <button type="submit" class="btn-primary">Adicionar Tarefa</button>
        </form>
    </section>

    <section class="task-filters" aria-label="Filtros e ordenação de tarefas">
        <div class="filter-group filter-search">
            <label for="filter-search">Buscar:</label>
            <input type="search" id="filter-search" placeholder="Buscar por descrição..." aria-label="Buscar por descrição">
        </div>

        <div class="filter-group">
            <label for="filter-status">Situação:</label>
            <select id="filter-status">
                <option value="todas">Todas</option>
                <option value="pendente">Pendentes</option>
                <option value="concluida">Concluídas</option>
            </select>
        </div>

        <div class="filter-group">
            <label for="filter-category">Categoria:</label>
            <select id="filter-category">
                <option value="todas">Todas</option>
            </select>
        </div>

        <div class="filter-group">
            <label for="filter-sort">Ordenar por:</label>
            <select id="filter-sort">
                <option value="padrao">Padrão</option>
                <option value="data-asc">Prazo mais próximo</option>
                <option value="data-desc">Prazo mais distante</option>
                <option value="dificuldade-asc">Dificuldade (Fácil → Difícil)</option>
                <option value="dificuldade-desc">Dificuldade (Difícil → Fácil)</option>
            </select>
        </div>
    </section>

    <main class="kanban-board">
        <!-- Mensagem de Situação Inicial (Exibida quando não há tarefas cadastradas) -->
        <div id="empty-state" class="empty-state" role="status" aria-live="polite">
            <p class="empty-title">Nenhuma tarefa cadastrada.</p>
            <p class="empty-subtitle">Adicione uma tarefa para começar!</p>
        </div>

        <!-- Coluna Fácil -->
        <section class="column column-facil">
            <div class="column-header">
                <h2>Fácil</h2>
            </div>
            <div class="column-content" id="col-facil">
                <!-- Cards renderizados via JS -->
            </div>
        </section>

        <!-- Coluna Moderado -->
        <section class="column column-moderado">
            <div class="column-header">
                <h2>Moderado</h2>
            </div>
            <div class="column-content" id="col-moderado">
                <!-- Cards renderizados via JS -->
            </div>
        </section>

        <!-- Coluna Difícil -->
        <section class="column column-dificil">
            <div class="column-header">
                <h2>Difícil</h2>
            </div>
            <div class="column-content" id="col-dificil">
                <!-- Cards renderizados via JS -->
            </div>
        </section>

        <!-- Coluna Concluído -->
        <section class="column column-concluido">
            <div class="column-header">
                <h2>Concluído</h2>
                <button id="btn-clear-done" class="btn-clear-done" type="button" title="Excluir todas as tarefas concluídas" disabled>Limpar</button>
            </div>
            <div class="column-content" id="col-concluido">
                <!-- Cards renderizados via JS -->
            </div>
        </section>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
