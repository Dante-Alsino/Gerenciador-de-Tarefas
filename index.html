<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    
    <header>
        <h1>✅ Gerenciador de Tarefas</h1>
    </header>

    <main>
        <!-- Área de Cadastro -->
        <section id="area-cadastro">
            <h2>Adicionar Nova Tarefa</h2>
            <!-- O formulário será construído aqui -->
        </section>

        <!-- Área de Filtros e Indicadores -->
        <section id="area-controles">
            <div id="indicadores">
                <!-- Resumo será inserido aqui -->
            </div>
            <div id="filtros">
                <!-- Filtros serão inseridos aqui -->
            </div>
        </section>

        <!-- Área de Apresentação das Tarefas -->
        <section id="area-tarefas">
            <h2>Lista de Tarefas</h2>
            <div id="mensagem-vazia">
                <p>Nenhuma tarefa cadastrada. Adicione uma tarefa para começar!</p>
            </div>
            <ul id="lista-tarefas">
                <!-- Tarefas renderizadas pelo JS aparecerão aqui -->
            </ul>
        </section>
    </main>

    <script src="./js/script.js"></script>
</body>
</html>
